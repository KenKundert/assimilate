name: Assimilate
on: [push, pull_request]
jobs:
  check-bats-version:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.x"]
      max-parallel: 6

    steps:
      - name: Checkout repository
      # uses: actions/checkout@v2
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Borg
        run: |
          wget -q https://github.com/borgbackup/borg/releases/download/2.0.0b24/borg-linux-glibc243-x86_64-gh
          chmod +x borg-linux-glibc239-x86_64-gh
          sudo mv borg-linux-glibc239-x86_64-gh /usr/local/bin/borg
          borg --version
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install tox
          pip install coveralls
      - name: Run tests
        run: tox
      - name: Report test coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_SERVICE_NAME: github
        run: coveralls
